name: Verify Excel Stats

on:
  push:
    branches:
      - stats-excel
    paths:
      - 'excel_stats_authority_patch.py'
      - 'data/excel_stats_blob/**'
      - 'scripts/verify_excel_stats.py'
      - '.github/workflows/verify-excel-stats.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile importer
        run: python -m py_compile excel_stats_authority_patch.py

      - name: Verify payload and isolated database sync
        run: PYTHONPATH=. python scripts/verify_excel_stats.py
