name: Apply AJPA Unassignment Feature

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-admin-unassignment-feature.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply source migration
        run: python apply_admin_unassignment_feature_v2.py

      - name: Validate Python sources
        run: |
          python -m py_compile \
            club_access_revocation.py \
            discord_departure_unassignment_patch.py \
            mobile_parity_api_patch.py \
            mobile_pairing_patch.py \
            bot.py

      - name: Test authoritative cleanup transaction
        run: |
          python - <<'PY'
          import sqlite3
          import club_access_revocation as access

          conn = sqlite3.connect(':memory:')
          conn.row_factory = sqlite3.Row
          conn.executescript('''
          CREATE TABLE clubs (user_id INTEGER PRIMARY KEY, name TEXT NOT NULL);
          CREATE TABLE mobile_sessions (
            token_hash TEXT PRIMARY KEY,
            user_id INTEGER NOT NULL,
            is_staff INTEGER NOT NULL DEFAULT 0,
            expires_at INTEGER NOT NULL,
            revoked_at INTEGER,
            created_at INTEGER NOT NULL
          );
          CREATE TABLE mobile_pair_codes (
            code TEXT PRIMARY KEY,
            user_id INTEGER NOT NULL,
            is_staff INTEGER NOT NULL DEFAULT 0,
            expires_at INTEGER NOT NULL,
            used_at INTEGER,
            created_at INTEGER NOT NULL
          );
          INSERT INTO clubs(user_id, name) VALUES (123, 'Bolton Wanderers');
          INSERT INTO mobile_sessions(token_hash,user_id,expires_at,created_at)
            VALUES ('abc',123,9999999999,1);
          INSERT INTO mobile_pair_codes(code,user_id,expires_at,created_at)
            VALUES ('ABCDEFGH',123,9999999999,1);
          ''')
          result = access.unassign_user_in_conn(
              conn, 123, actor_id=999, source='ADMIN_MOBILE', queue_discord=True
          )
          conn.commit()
          assert result['club'] == 'Bolton Wanderers'
          assert conn.execute('SELECT 1 FROM clubs WHERE user_id=123').fetchone() is None
          assert conn.execute('SELECT revoked_at FROM mobile_sessions WHERE user_id=123').fetchone()[0]
          assert conn.execute('SELECT used_at FROM mobile_pair_codes WHERE user_id=123').fetchone()[0]
          assert conn.execute('SELECT action FROM club_assignment_history WHERE user_id=123').fetchone()[0] == 'DESVINCULADO_ADMIN'
          assert conn.execute('SELECT active FROM club_assignment_guard WHERE user_id=123').fetchone()[0] == 0
          assert conn.execute("SELECT 1 FROM club_unassignment_discord_outbox WHERE user_id=123 AND status='PENDING'").fetchone()
          print('PASS Bolton-style stale assignment cleanup')
          PY

      - name: Validate OTA patch script syntax
        run: node --check mobile/scripts/apply-discord-menu-parity.mjs

      - name: Check diff
        run: git diff --check

      - name: Commit migrated sources
        run: |
          git config user.name "AJPA Feature Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            bot.py \
            mobile_pairing_patch.py \
            mobile_parity_api_patch.py \
            mobile/src/api.ts \
            mobile/scripts/apply-discord-menu-parity.mjs
          if git diff --cached --quiet; then
            echo "Feature already applied."
            exit 0
          fi
          git commit -m "Enable automatic Discord leave cleanup and mobile unassign"
          git push origin HEAD:main
