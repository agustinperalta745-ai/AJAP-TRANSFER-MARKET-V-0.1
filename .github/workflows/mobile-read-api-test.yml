name: Mobile API Tests

on:
  push:
    branches:
      - main
      - feature/mobile-app-foundation
    paths:
      - 'mobile_read_api.py'
      - 'mobile_write_api.py'
      - 'mobile_write_release_compat.py'
      - 'mobile_auth.py'
      - 'mobile_auth_patch.py'
      - 'mobile_pairing_patch.py'
      - 'mobile_pairing_bootstrap_patch.py'
      - 'mobile_staff_api_patch.py'
      - 'mobile_match_search_patch.py'
      - 'bot_mobile.py'
      - 'tests/test_mobile_read_api.py'
      - 'tests/test_mobile_write_api.py'
      - 'tests/test_mobile_match_search_patch.py'
      - '.github/workflows/mobile-read-api-test.yml'
  pull_request:
    paths:
      - 'mobile_read_api.py'
      - 'mobile_write_api.py'
      - 'mobile_write_release_compat.py'
      - 'mobile_auth.py'
      - 'mobile_auth_patch.py'
      - 'mobile_pairing_patch.py'
      - 'mobile_pairing_bootstrap_patch.py'
      - 'mobile_staff_api_patch.py'
      - 'mobile_match_search_patch.py'
      - 'bot_mobile.py'
      - 'tests/test_mobile_read_api.py'
      - 'tests/test_mobile_write_api.py'
      - 'tests/test_mobile_match_search_patch.py'

jobs:
  test-mobile-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile mobile backend
        run: python -m py_compile mobile_read_api.py mobile_write_api.py mobile_write_release_compat.py mobile_auth.py mobile_auth_patch.py mobile_pairing_patch.py mobile_pairing_bootstrap_patch.py mobile_staff_api_patch.py mobile_match_search_patch.py bot_mobile.py
      - name: Run mobile API tests
        run: python -m unittest tests/test_mobile_read_api.py tests/test_mobile_write_api.py tests/test_mobile_match_search_patch.py -v
