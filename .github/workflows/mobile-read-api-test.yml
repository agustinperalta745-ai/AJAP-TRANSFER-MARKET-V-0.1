name: Mobile Read API Tests

on:
  push:
    branches:
      - feature/mobile-app-foundation
    paths:
      - 'mobile_read_api.py'
      - 'bot_mobile.py'
      - 'tests/test_mobile_read_api.py'
      - '.github/workflows/mobile-read-api-test.yml'
  pull_request:
    paths:
      - 'mobile_read_api.py'
      - 'bot_mobile.py'
      - 'tests/test_mobile_read_api.py'

jobs:
  test-read-only-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest tests/test_mobile_read_api.py -v
