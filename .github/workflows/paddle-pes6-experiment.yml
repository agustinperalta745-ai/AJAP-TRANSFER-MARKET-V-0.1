name: Paddle PES6 isolated experiment

on:
  push:
    branches:
      - experiment/paddleocr-pes6
    paths:
      - tools/pes6_paddle_probe.py
      - requirements-paddle-experiment.txt
      - tests/fixtures/*.b64
      - tests/fixtures/tzparts/**
      - .github/workflows/paddle-pes6-experiment.yml
  workflow_dispatch:

jobs:
  paddle-pes6-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install isolated PaddleOCR CPU stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.3.0
          python -m pip install -r requirements-paddle-experiment.txt

      - name: Rebuild real PES6 fixtures
        run: |
          mkdir -p .tmp-paddle
          cat \
            tests/fixtures/tzparts/part01.b64 \
            tests/fixtures/tzparts/part02.b64 \
            tests/fixtures/tzparts/part03.b64 \
            tests/fixtures/tzparts/part04.b64 \
            tests/fixtures/tzparts/part05a.b64 \
            tests/fixtures/tzparts/part05b.b64 \
            tests/fixtures/tzparts/part06.b64 \
            tests/fixtures/tzparts/part07a.b64 \
            tests/fixtures/tzparts/part07b.b64 \
            | tr -d '\n\r ' | base64 --decode > .tmp-paddle/teesside-zaragoza.jpg
          for name in mbv_res sb_res ve_res; do
            tr -d '\n\r ' < "tests/fixtures/${name}.jpg.b64" | base64 --decode > ".tmp-paddle/${name}.jpg"
          done
          python - <<'PY'
          from PIL import Image
          paths = [
              '.tmp-paddle/teesside-zaragoza.jpg',
              '.tmp-paddle/mbv_res.jpg',
              '.tmp-paddle/sb_res.jpg',
              '.tmp-paddle/ve_res.jpg',
          ]
          for p in paths:
              im = Image.open(p)
              size = im.size
              fmt = im.format
              im.load()
              print('AJAP_FIXTURE_VALID', p, size, fmt)
          PY

      - name: Run real fixture batch
        env:
          PADDLE_PDX_MODEL_SOURCE: BOS
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
        run: |
          set +e
          for item in teesside-zaragoza mbv_res ve_res sb_res; do
            python tools/pes6_paddle_probe.py ".tmp-paddle/${item}.jpg" > ".tmp-paddle/result-${item}.json"
            echo "AJAP_PROBE_EXIT ${item} $?"
          done
          set -e

      - name: Validate result batch and safe rejection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              'teesside-zaragoza': ('Middlesbrough', 1, 6, 'Real Zaragoza'),
              'mbv_res': ('Manchester City', 1, 0, 'Villarreal'),
              've_res': ('Villarreal', 3, 1, 'West Ham United'),
          }
          failures = []
          for name, wanted in expected.items():
              data = json.loads(Path(f'.tmp-paddle/result-{name}.json').read_text())
              got = (data.get('home_team'), data.get('home_goals'), data.get('away_goals'), data.get('away_team'))
              checks = {
                  'exact_result': got == wanted,
                  'final': data.get('is_final') is True,
                  'screen_kind_result': data.get('screen_kind') == 'result',
                  'complete': data.get('result_complete') is True,
              }
              print('AJAP_RESULT', name, 'wanted=', wanted, 'got=', got, 'checks=', checks, 'elapsed=', data.get('elapsed_seconds'))
              failures.extend(f'{name}:{key}' for key, ok in checks.items() if not ok)

          safety = json.loads(Path('.tmp-paddle/result-sb_res.json').read_text())
          safety_checks = {
              'does_not_create_official_result': safety.get('result_complete') is False,
              'not_classified_as_result': safety.get('screen_kind') != 'result',
          }
          print('AJAP_SAFETY sporting-borussia', safety_checks, 'raw=', (safety.get('home_team_raw'), safety.get('away_team_raw')))
          failures.extend(f'safety:{key}' for key, ok in safety_checks.items() if not ok)

          if failures:
              raise SystemExit('FAILED: ' + ', '.join(failures))
          print('AJAP_PADDLE_BATCH_OK')
          PY

      - name: Upload probe outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paddle-pes6-probe-output
          path: .tmp-paddle/result-*.json
          if-no-files-found: warn
