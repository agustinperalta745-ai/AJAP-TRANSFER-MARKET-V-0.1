name: Paddle PES6 isolated experiment

on:
  push:
    branches:
      - experiment/paddleocr-pes6
    paths:
      - tools/pes6_paddle_probe.py
      - requirements-paddle-experiment.txt
      - tests/fixtures/*.b64
      - tests/fixtures/tzparts/**
      - .github/workflows/paddle-pes6-experiment.yml
  workflow_dispatch:

jobs:
  paddle-pes6-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install isolated PaddleOCR CPU stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.3.0
          python -m pip install -r requirements-paddle-experiment.txt

      - name: Rebuild real PES6 fixtures
        run: |
          mkdir -p .tmp-paddle
          cat \
            tests/fixtures/tzparts/part01.b64 \
            tests/fixtures/tzparts/part02.b64 \
            tests/fixtures/tzparts/part03.b64 \
            tests/fixtures/tzparts/part04.b64 \
            tests/fixtures/tzparts/part05a.b64 \
            tests/fixtures/tzparts/part05b.b64 \
            tests/fixtures/tzparts/part06.b64 \
            tests/fixtures/tzparts/part07a.b64 \
            tests/fixtures/tzparts/part07b.b64 \
            | tr -d '\n\r ' | base64 --decode > .tmp-paddle/teesside-zaragoza.jpg
          tr -d '\n\r ' < tests/fixtures/psg_feyenoord_1_1_probe.jpg.b64 | base64 --decode > .tmp-paddle/psg-feyenoord.jpg
          python - <<'PY'
          from PIL import Image
          for p in ('.tmp-paddle/teesside-zaragoza.jpg', '.tmp-paddle/psg-feyenoord.jpg'):
              im=Image.open(p)
              size=im.size
              im.verify()
              print('AJAP_FIXTURE_VALID', p, size)
          PY

      - name: Run Teesside Zaragoza probe
        env:
          PADDLE_PDX_MODEL_SOURCE: BOS
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
        run: |
          set +e
          python tools/pes6_paddle_probe.py .tmp-paddle/teesside-zaragoza.jpg > .tmp-paddle/result-teesside.json
          probe_code=$?
          set -e
          cat .tmp-paddle/result-teesside.json
          echo "probe_exit_code=$probe_code"

      - name: Validate Teesside 1-6 Zaragoza
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.tmp-paddle/result-teesside.json').read_text())
          checks = {
              'teesside_to_middlesbrough': data.get('home_team') == 'Middlesbrough',
              'r_zaragoza_to_real_zaragoza': data.get('away_team') == 'Real Zaragoza',
              'home_score_1': data.get('home_goals') == 1,
              'away_score_6': data.get('away_goals') == 6,
              'final_detected': data.get('is_final') is True,
              'screen_kind_result': data.get('screen_kind') == 'result',
          }
          print('AJAP_TEESSIDE_CHECKS=' + json.dumps(checks, ensure_ascii=False))
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('FAILED: ' + ', '.join(failed))
          print('AJAP_TEESSIDE_OK')
          PY

      - name: Run PSG Feyenoord probe
        env:
          PADDLE_PDX_MODEL_SOURCE: BOS
          PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
        run: |
          set +e
          python tools/pes6_paddle_probe.py .tmp-paddle/psg-feyenoord.jpg > .tmp-paddle/result-psg.json
          probe_code=$?
          set -e
          cat .tmp-paddle/result-psg.json
          echo "probe_exit_code=$probe_code"

      - name: Validate PSG 1-1 Feyenoord
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.tmp-paddle/result-psg.json').read_text())
          checks = {
              'psg': data.get('home_team') == 'París Saint-Germain (PSG)',
              'feyenoord': data.get('away_team') == 'Feyenoord',
              'home_score_1': data.get('home_goals') == 1,
              'away_score_1': data.get('away_goals') == 1,
              'final_detected': data.get('is_final') is True,
              'screen_kind_result': data.get('screen_kind') == 'result',
          }
          print('AJAP_PSG_CHECKS=' + json.dumps(checks, ensure_ascii=False))
          print('AJAP_PSG_RAW=' + repr((data.get('home_team_raw'), data.get('away_team_raw'), data.get('state_raw'))))
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('FAILED: ' + ', '.join(failed))
          print('AJAP_PSG_OK')
          PY

      - name: Upload probe outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paddle-pes6-probe-output
          path: .tmp-paddle/result-*.json
          if-no-files-found: warn
