name: Paddle PES6 isolated experiment

on:
  push:
    branches:
      - experiment/paddleocr-pes6
    paths:
      - tools/pes6_paddle_probe.py
      - requirements-paddle-experiment.txt
      - tests/fixtures/teesside_zaragoza_valid.jpg.b64
      - .github/workflows/paddle-pes6-experiment.yml
  workflow_dispatch:

jobs:
  paddle-pes6-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install isolated PaddleOCR CPU stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.3.0
          python -m pip install -r requirements-paddle-experiment.txt

      - name: Decode Teesside Zaragoza fixture
        run: |
          mkdir -p .tmp-paddle
          base64 --decode tests/fixtures/teesside_zaragoza_valid.jpg.b64 > .tmp-paddle/teesside-zaragoza-1-6.jpg
          file .tmp-paddle/teesside-zaragoza-1-6.jpg
          python - <<'PY'
          from PIL import Image
          im = Image.open('.tmp-paddle/teesside-zaragoza-1-6.jpg')
          print('AJAP_FIXTURE_SIZE=', im.size)
          im.verify()
          print('AJAP_FIXTURE_VALID')
          PY

      - name: Run isolated PP-OCRv6 tiny probe
        env:
          PADDLE_PDX_MODEL_SOURCE: BOS
        run: |
          set +e
          python tools/pes6_paddle_probe.py .tmp-paddle/teesside-zaragoza-1-6.jpg > .tmp-paddle/result.json
          probe_code=$?
          set -e
          cat .tmp-paddle/result.json
          echo "probe_exit_code=$probe_code"

      - name: Validate stock PES6 aliases and 1-6 score
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.tmp-paddle/result.json').read_text())
          checks = {
              'teesside_to_middlesbrough': data.get('home_team') == 'Middlesbrough',
              'r_zaragoza_to_real_zaragoza': data.get('away_team') == 'Real Zaragoza',
              'home_score_1': data.get('home_goals') == 1,
              'away_score_6': data.get('away_goals') == 6,
              'final_detected': data.get('is_final') is True,
              'screen_kind_result': data.get('screen_kind') == 'result',
          }
          print('AJAP_EXPECTED_CHECKS=' + json.dumps(checks, ensure_ascii=False))
          print('AJAP_RAW_TEAMS=' + repr((data.get('home_team_raw'), data.get('away_team_raw'))))
          print('AJAP_RESOLVED=' + repr((data.get('home_team'), data.get('home_goals'), data.get('away_goals'), data.get('away_team'))))
          print('AJAP_ELAPSED_SECONDS=' + str(data.get('elapsed_seconds')))
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('FAILED: ' + ', '.join(failed))
          print('AJAP_PADDLE_ALIAS_FIXTURE_OK')
          PY

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paddle-pes6-probe-output
          path: .tmp-paddle/result.json
          if-no-files-found: warn
