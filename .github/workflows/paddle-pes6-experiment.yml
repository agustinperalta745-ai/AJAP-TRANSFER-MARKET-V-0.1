name: Paddle PES6 isolated experiment

on:
  push:
    branches:
      - experiment/paddleocr-pes6
    paths:
      - tools/pes6_paddle_probe.py
      - requirements-paddle-experiment.txt
      - tests/fixtures/psg_feyenoord_1_1_probe.jpg.b64
      - .github/workflows/paddle-pes6-experiment.yml
  workflow_dispatch:

jobs:
  paddle-pes6-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install isolated PaddleOCR CPU stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.3.0
          python -m pip install -r requirements-paddle-experiment.txt

      - name: Decode real AJAP PES6 fixture
        run: |
          mkdir -p .tmp-paddle
          base64 --decode tests/fixtures/psg_feyenoord_1_1_probe.jpg.b64 > .tmp-paddle/psg-feyenoord-1-1.jpg
          file .tmp-paddle/psg-feyenoord-1-1.jpg

      - name: Run isolated PP-OCRv6 tiny probe
        env:
          PADDLE_PDX_MODEL_SOURCE: BOS
        run: |
          set +e
          python tools/pes6_paddle_probe.py .tmp-paddle/psg-feyenoord-1-1.jpg > .tmp-paddle/result.json
          probe_code=$?
          set -e
          cat .tmp-paddle/result.json
          echo "probe_exit_code=$probe_code"

      - name: Validate the known 1-1 fixture
        run: |
          python - <<'PY'
          import json
          import unicodedata
          from pathlib import Path

          data = json.loads(Path('.tmp-paddle/result.json').read_text())
          def norm(value):
              value = unicodedata.normalize('NFKD', str(value or ''))
              value = ''.join(ch for ch in value if not unicodedata.combining(ch))
              return value.casefold()

          home = norm(data.get('home_team_raw'))
          away = norm(data.get('away_team_raw'))
          checks = {
              'home_has_paris': 'paris' in home,
              'away_has_feyenoord': 'feyenoord' in away,
              'home_score_1': data.get('home_goals') == 1,
              'away_score_1': data.get('away_goals') == 1,
              'final_detected': data.get('is_final') is True,
          }
          print('AJAP_EXPECTED_CHECKS=' + json.dumps(checks, ensure_ascii=False))
          print('AJAP_ELAPSED_SECONDS=' + str(data.get('elapsed_seconds')))
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('FAILED: ' + ', '.join(failed))
          print('AJAP_PADDLE_FIXTURE_OK')
          PY

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paddle-pes6-probe-output
          path: .tmp-paddle/result.json
          if-no-files-found: warn
