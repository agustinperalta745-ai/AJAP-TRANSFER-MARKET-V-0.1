name: Apply AJPA menu backgrounds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-mobile-backgrounds.yml'

permissions:
  contents: write

jobs:
  apply-backgrounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply backgrounds
        run: python mobile/apply_botparity_backgrounds.py

      - name: Commit backgrounds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/BotParityAppV2.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Show AJPA background images in current mobile UI"
            git push
          fi
