name: Mobile Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/mobile-app-foundation
      - fix/mobile-clausulazo-badges
      - fix/team-card-gradients
      - ui-redesign
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-preview-apk.yml'

jobs:
  build-android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install


      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - name: Build standalone APK
        run: ./gradlew assembleRelease
        working-directory: mobile/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AJPA-UI-Lab-safe.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AJPA-UI-Lab-safe
          path: mobile/AJPA-UI-Lab-safe.apk
          if-no-files-found: error
