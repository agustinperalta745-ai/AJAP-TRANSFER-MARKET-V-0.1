name: Mobile Preview APK

on:
  push:
    branches:
      - main
      - feature/mobile-app-foundation
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-preview-apk.yml'

jobs:
  build-android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare polished visuals and launcher icon
        run: |
          base64 -d icon.b64 > icon.png
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.icon = './icon.png';
          app.expo.android = {
            ...app.expo.android,
            adaptiveIcon: {
              foregroundImage: './icon.png',
              backgroundColor: '#02060a'
            }
          };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2));

          const uiPath = 'src/LiveAppBackgrounds.tsx';
          let ui = fs.readFileSync(uiPath, 'utf8');
          ui = ui.replace(
            '<Image source={{ uri: BG[tab] }} style={s.background} resizeMode="cover" />',
            '<Image source={{ uri: BG[tab] }} style={s.background} resizeMode="cover" blurRadius={6} />'
          );
          fs.writeFileSync(uiPath, ui);
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

      - name: Build standalone APK
        run: ./gradlew assembleRelease
        working-directory: mobile/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AJPA-Transfer-Market-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AJPA-Transfer-Market-preview
          path: mobile/AJPA-Transfer-Market-preview.apk
          if-no-files-found: error
