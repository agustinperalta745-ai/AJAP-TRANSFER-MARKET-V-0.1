name: Mobile Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/mobile-app-foundation
      - fix/mobile-clausulazo-badges
    paths:
      - 'mobile/**'
      - 'bot_mobile.py'
      - 'mobile_*api*.py'
      - 'mobile_transport_patch.py'
      - '.github/workflows/mobile-preview-apk.yml'

jobs:
  build-android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Verify live AJPA API and mutation tunnel
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ['EXPO_PUBLIC_API_URL'].rstrip('/')
          health = base + '/health'
          mutations = [
              (base + '/api/v1/publications', '%7B%7D', 'market mutation'),
              (
                  base + '/api/v1/admin/economy/adjust',
                  '%7B%22club%22%3A%22probe%22%2C%22amount%22%3A1%2C%22mode%22%3A%22ADD%22%7D',
                  'Staff economy mutation',
              ),
          ]
          last = None

          for attempt in range(36):
              try:
                  with urllib.request.urlopen(health, timeout=10) as response:
                      if not (200 <= response.status < 300):
                          raise RuntimeError(f'health HTTP {response.status}')

                  for mutation, body_header, label in mutations:
                      req = urllib.request.Request(
                          mutation,
                          method='GET',
                          headers={
                              'X-AJPA-Method': 'POST',
                              'X-AJPA-Body': body_header,
                          },
                      )
                      try:
                          urllib.request.urlopen(req, timeout=10)
                          raise RuntimeError(f'{label} accepted an unauthenticated request')
                      except urllib.error.HTTPError as exc:
                          body = exc.read().decode('utf-8', errors='replace')
                          if exc.code != 401:
                              raise RuntimeError(f'{label} HTTP {exc.code}: {body}') from exc
                          print(f'AJPA {label} OK: HTTP 401 as expected | {body}')
                  break
              except Exception as exc:
                  last = exc

              print(f'Waiting for corrected Railway API ({attempt + 1}/36): {last}')
              if attempt < 35:
                  time.sleep(10)
          else:
              raise SystemExit(f'AJPA mutation tunnel not ready: {last}')
          PY

      - name: Apply Discord menu parity
        run: node scripts/apply-discord-menu-parity.mjs

      - name: Team badges disabled
        run: echo 'AJPA Mobile se compila sin escudos de clubes'

      - name: Apply operational Clausulazo
        run: node scripts/apply-clausulazo-mobile.mjs

      - name: Apply operational Staff market
        run: node scripts/apply-staff-mobile.mjs

      - name: Apply operational Staff economy
        run: node scripts/apply-staff-economy-mobile.mjs

      - name: Apply operational club resignation
        run: node scripts/apply-resignation-mobile.mjs

      - name: Apply organized menus and panel style
        run: node scripts/apply-organized-menu-style.mjs

      - name: Apply premium navigation and glass effects
        run: node scripts/apply-premium-navigation-style.mjs

      - name: Apply approved personalized layout
        run: node scripts/apply-approved-screen-layout.mjs

      - name: Preserve Clausulazo screen after layout
        run: node scripts/restore-clausulazo-screen.mjs

      - name: Apply runtime crash and visual fixes
        run: node scripts/apply-runtime-visual-fixes.mjs

      - name: Prepare polished visuals
        run: |
          node <<'NODE'
          const fs = require('fs');
          const uiPath = 'src/LiveAppBackgrounds.tsx';
          let ui = fs.readFileSync(uiPath, 'utf8');
          if (!ui.includes('blurRadius={6}')) {
            ui = ui.replace(
              '<Image source={{ uri: BG[tab] }} style={s.background} resizeMode="cover" />',
              '<Image source={{ uri: BG[tab] }} style={s.background} resizeMode="cover" blurRadius={6} />'
            );
          }
          fs.writeFileSync(uiPath, ui);
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

      - name: Build standalone APK
        run: ./gradlew assembleRelease
        working-directory: mobile/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AJPA-Transfer-Market-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AJPA-Transfer-Market-preview
          path: mobile/AJPA-Transfer-Market-preview.apk
          if-no-files-found: error
