name: Mobile Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/mobile-app-foundation
      - fix/mobile-clausulazo-badges
    paths:
      - 'mobile/**'
      - 'bot_mobile.py'
      - 'mobile_*api*.py'
      - 'mobile_transport_patch.py'
      - '.github/workflows/mobile-preview-apk.yml'

jobs:
  build-android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Verify live AJPA API and mutation tunnel
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ['EXPO_PUBLIC_API_URL'].rstrip('/')
          health = base + '/health'
          mutation = base + '/api/v1/publications'
          last = None

          # Wait for Railway to expose the same revision before compiling an APK.
          # A tunneled unauthenticated publication MUST reach the write stack and
          # answer 401. 404/405 means the old read-only transport is still live.
          for attempt in range(36):
              try:
                  with urllib.request.urlopen(health, timeout=10) as response:
                      if not (200 <= response.status < 300):
                          raise RuntimeError(f'health HTTP {response.status}')

                  req = urllib.request.Request(
                      mutation,
                      method='GET',
                      headers={
                          'X-AJPA-Method': 'POST',
                          'X-AJPA-Body': '%7B%7D',
                      },
                  )
                  try:
                      urllib.request.urlopen(req, timeout=10)
                      last = RuntimeError('mutation tunnel accepted an unauthenticated request')
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode('utf-8', errors='replace')
                      if exc.code == 401:
                          print(f'AJPA mutation tunnel OK: HTTP 401 as expected | {body}')
                          break
                      last = RuntimeError(f'mutation tunnel HTTP {exc.code}: {body}')
              except Exception as exc:
                  last = exc

              print(f'Waiting for corrected Railway API ({attempt + 1}/36): {last}')
              if attempt < 35:
                  time.sleep(10)
          else:
              raise SystemExit(f'AJPA mutation tunnel not ready: {last}')
          PY

      - name: Apply Discord menu parity
        run: node scripts/apply-discord-menu-parity.mjs

      - name: Team badges disabled
        run: echo 'AJPA Mobile se compila sin escudos de clubes'

      - name: Apply operational Clausulazo
        run: node scripts/apply-clausulazo-mobile.mjs

      - name: Apply operational Staff market
        run: node scripts/apply-staff-mobile.mjs

      - name: Apply operational club resignation
        run: node scripts/apply-resignation-mobile.mjs

      - name: Apply Clausulazo Figo background
        run: |
          node <<'NODE'
          const fs = require('fs');
          const uiPath = 'src/BotParityAppV2.tsx';
          let ui = fs.readFileSync(uiPath, 'utf8');
          const figo = 'https://img.vavel.com/b/figo%20traspaso.jpg';
          const from = `  const screenBackground = (() => {\n    if (screen === 'profile') return BG_PERFIL;`;
          const to = `  const screenBackground = (() => {\n    if (screen === 'clausulazo') return '${figo}';\n    if (screen === 'profile') return BG_PERFIL;`;
          if (!ui.includes(`screen === 'clausulazo') return '${figo}'`)) {
            if (!ui.includes(from)) throw new Error('No se encontró selector de fondo para Clausulazo');
            ui = ui.replace(from, to);
          }
          fs.writeFileSync(uiPath, ui);
          NODE

      - name: Prepare polished visuals
        run: |
          node <<'NODE'
          const fs = require('fs');
          const uiPath = 'src/LiveAppBackgrounds.tsx';
          let ui = fs.readFileSync(uiPath, 'utf8');
          if (!ui.includes('blurRadius={6}')) {
            ui = ui.replace(
              '<Image source={{ uri: BG[tab] }} style={s.background} resizeMode="cover" />',
              '<Image source={{ uri: BG[tab] }} style={s.background} resizeMode="cover" blurRadius={6} />'
            );
          }
          fs.writeFileSync(uiPath, ui);
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

      - name: Build standalone APK
        run: ./gradlew assembleRelease
        working-directory: mobile/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AJPA-Transfer-Market-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AJPA-Transfer-Market-preview
          path: mobile/AJPA-Transfer-Market-preview.apk
          if-no-files-found: error
