name: Mobile Preview APK

on:
  push:
    branches:
      - main
      - feature/mobile-app-foundation
      - fix/mobile-clausulazo-badges
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-preview-apk.yml'

jobs:
  build-android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Verify live AJPA API
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request

          url = os.environ['EXPO_PUBLIC_API_URL'].rstrip('/') + '/health'
          last = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      if 200 <= response.status < 300:
                          print(f'AJPA API OK: {url} -> HTTP {response.status}')
                          break
                      last = RuntimeError(f'HTTP {response.status}')
              except Exception as exc:
                  last = exc
              if attempt < 11:
                  time.sleep(10)
          else:
              raise SystemExit(f'AJPA API no responde en {url}: {last}')
          PY

      - name: Apply Discord menu parity
        run: node scripts/apply-discord-menu-parity.mjs

      - name: Prepare HQ team badges
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const badges = {
            ajax: 'AFC Ajax',
            as_monaco: 'AS Monaco FC',
            aston_villa: 'Aston Villa F.C.',
            atletico_madrid: 'Atlético Madrid',
            benfica: 'S.L. Benfica',
            bolton_wanderers: 'Bolton Wanderers F.C.',
            everton: 'Everton F.C.',
            feyenoord: 'Feyenoord',
            fiorentina: 'ACF Fiorentina',
            fulham: 'Fulham F.C.',
            galatasaray: 'Galatasaray S.K. (football)',
            lazio: 'S.S. Lazio',
            manchester_city: 'Manchester City F.C.',
            middlesbrough: 'Middlesbrough F.C.',
            olympique_lyon: 'Olympique Lyonnais',
            olympique_marseille: 'Olympique de Marseille',
            porto: 'FC Porto',
            psg: 'Paris Saint-Germain F.C.',
            real_betis: 'Real Betis',
            sevilla: 'Sevilla FC',
            torino: 'Torino FC',
            tottenham_hotspur: 'Tottenham Hotspur F.C.',
            villarreal: 'Villarreal CF',
            west_ham_united: 'West Ham United F.C.',
            zaragoza: 'Real Zaragoza',
          };

          const userAgent = 'AJPA-Transfer-Market/0.1 mobile-build';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          fs.rmSync('assets/teams_hq', { recursive: true, force: true });
          fs.mkdirSync('assets/teams_hq', { recursive: true });

          async function fetchWithRetry(url, options = {}) {
            let last;
            for (let attempt = 1; attempt <= 4; attempt++) {
              try {
                const response = await fetch(url, options);
                if (response.ok) return response;
                last = new Error(`HTTP ${response.status}`);
              } catch (error) {
                last = error;
              }
              await sleep(attempt * 750);
            }
            throw last;
          }

          (async () => {
            for (const [file, title] of Object.entries(badges)) {
              const api = `https://en.wikipedia.org/w/api.php?action=query&format=json&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=1024&titles=${encodeURIComponent(title)}`;
              const meta = await fetchWithRetry(api, {
                headers: { Accept: 'application/json', 'User-Agent': userAgent },
              });
              const payload = await meta.json();
              const pages = payload?.query?.pages ? Object.values(payload.query.pages) : [];
              const uri = pages[0]?.thumbnail?.source;
              if (!uri) throw new Error(`${file}: Wikipedia no devolvió escudo para ${title}`);

              const image = await fetchWithRetry(uri, { headers: { 'User-Agent': userAgent } });
              const bytes = Buffer.from(await image.arrayBuffer());
              const type = image.headers.get('content-type') || '';
              const isPng = bytes.length > 8
                && bytes[0] === 0x89 && bytes[1] === 0x50
                && bytes[2] === 0x4e && bytes[3] === 0x47;
              if (!type.startsWith('image/') || !isPng || bytes.length < 1500) {
                throw new Error(`${file}: escudo inválido (${type}, ${bytes.length} bytes)`);
              }

              fs.writeFileSync(path.join('assets/teams_hq', `${file}.png`), bytes);
              console.log(`HQ badge OK ${file}: ${bytes.length} bytes`);
              await sleep(180);
            }

            const expected = Object.keys(badges).length;
            const written = fs.readdirSync('assets/teams_hq').filter(name => name.endsWith('.png')).length;
            if (written !== expected) throw new Error(`Escudos HQ incompletos: ${written}/${expected}`);
            console.log(`Escudos HQ listos: ${written}/${expected}`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Apply team badges
        run: node scripts/apply-team-badges.mjs

      - name: Make team badge protagonist
        run: |
          node <<'NODE'
          const fs = require('fs');
          const uiPath = 'src/BotParityAppV2.tsx';
          let ui = fs.readFileSync(uiPath, 'utf8');
          ui = ui.replace(
            '<ClubBadge club={profile.club} size={154} />',
            '<ClubBadge club={profile.club} size={190} />'
          );
          ui = ui.replace(
            "homeHeroRow: { minHeight: 178, flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', gap: 8 },",
            "homeHeroRow: { minHeight: 246, flexDirection: 'column-reverse', alignItems: 'center', justifyContent: 'center', gap: 4 },"
          );
          ui = ui.replace(
            "homeHeroText: { flex: 1, minWidth: 0, justifyContent: 'center' },",
            "homeHeroText: { width: '100%', minWidth: 0, justifyContent: 'center' },"
          );
          ui = ui.replace(
            "homeHeroBadgeWrap: { width: 160, height: 168, alignItems: 'center', justifyContent: 'center' },",
            "homeHeroBadgeWrap: { width: '100%', height: 198, alignItems: 'center', justifyContent: 'center' },"
          );
          if (!ui.includes('<ClubBadge club={profile.club} size={190} />')) {
            throw new Error('No se pudo agrandar el escudo protagonista');
          }
          fs.writeFileSync(uiPath, ui);
          NODE

      - name: Apply operational Clausulazo
        run: node scripts/apply-clausulazo-mobile.mjs

      - name: Apply operational Staff market
        run: node scripts/apply-staff-mobile.mjs

      - name: Apply Clausulazo Figo background
        run: |
          node <<'NODE'
          const fs = require('fs');
          const uiPath = 'src/BotParityAppV2.tsx';
          let ui = fs.readFileSync(uiPath, 'utf8');
          const figo = 'https://img.vavel.com/b/figo%20traspaso.jpg';
          const from = `  const screenBackground = (() => {\n    if (screen === 'profile') return BG_PERFIL;`;
          const to = `  const screenBackground = (() => {\n    if (screen === 'clausulazo') return '${figo}';\n    if (screen === 'profile') return BG_PERFIL;`;
          if (!ui.includes(`screen === 'clausulazo') return '${figo}'`)) {
            if (!ui.includes(from)) throw new Error('No se encontró selector de fondo para Clausulazo');
            ui = ui.replace(from, to);
          }
          fs.writeFileSync(uiPath, ui);
          NODE

      - name: Prepare polished visuals
        run: |
          node <<'NODE'
          const fs = require('fs');
          const uiPath = 'src/LiveAppBackgrounds.tsx';
          let ui = fs.readFileSync(uiPath, 'utf8');
          if (!ui.includes('blurRadius={6}')) {
            ui = ui.replace(
              '<Image source={{ uri: BG[tab] }} style={s.background} resizeMode="cover" />',
              '<Image source={{ uri: BG[tab] }} style={s.background} resizeMode="cover" blurRadius={6} />'
            );
          }
          fs.writeFileSync(uiPath, ui);
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

      - name: Build standalone APK
        run: ./gradlew assembleRelease
        working-directory: mobile/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AJPA-Transfer-Market-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AJPA-Transfer-Market-preview
          path: mobile/AJPA-Transfer-Market-preview.apk
          if-no-files-found: error
