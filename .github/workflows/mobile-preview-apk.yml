name: Mobile Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/mobile-app-foundation
      - fix/mobile-clausulazo-badges
      - fix/team-card-gradients
      - ui-redesign
    paths:
      - 'mobile/**'
      - 'bot_mobile.py'
      - 'mobile_*api*.py'
      - 'mobile_transport_patch.py'
      - '.github/workflows/mobile-preview-apk.yml'

jobs:
  build-android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://site--ajap-transfer-market-v-01--hkzlw9zsgh25.code.run

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install

      - name: Prepare standard UI icons
        run: node scripts/prepare-ui-lab-icons.mjs

      - name: Prepare embedded HQ club badges
        run: |
          node scripts/prepare-ui-lab-badges.mjs
          node scripts/apply-all-hq-team-badges.mjs

      - name: Prepare neutral AJPA hero
        run: node scripts/prepare-ui-lab-hero.mjs

      - name: Apply Discord menu parity
        run: node scripts/apply-discord-menu-parity.mjs

      - name: Apply operational Clausulazo
        run: node scripts/apply-clausulazo-mobile.mjs

      - name: Apply operational Staff market
        run: node scripts/apply-staff-mobile.mjs

      - name: Apply operational Staff economy
        run: node scripts/apply-staff-economy-mobile.mjs

      - name: Apply operational club resignation
        run: node scripts/apply-resignation-mobile.mjs

      - name: Apply organized menus and panel style
        run: node scripts/apply-organized-menu-style.mjs

      - name: Apply premium navigation and glass effects
        run: node scripts/apply-premium-navigation-style.mjs

      - name: Apply approved personalized layout
        run: node scripts/apply-approved-screen-layout.mjs

      - name: Preserve Clausulazo screen after layout
        run: node scripts/restore-clausulazo-screen.mjs

      - name: Apply runtime crash and visual fixes
        run: node scripts/apply-runtime-visual-fixes.mjs

      - name: Fix saved GES admin state
        run: node scripts/fix-ges-admin-sync-state.mjs

      - name: Apply club profiles, treasury and awards
        run: node scripts/apply-club-profiles-awards.mjs

      - name: Apply classic rival system
        run: node scripts/apply-classic-rival-mobile.mjs

      - name: Prepare local Liga and Mercado backgrounds
        run: node scripts/prepare-local-section-backgrounds.mjs

      - name: Apply premium depth v2 and Liga background
        run: node scripts/apply-premium-depth-v2.mjs

      - name: Apply and validate Monaco HD badge
        run: node scripts/apply-monaco-badge-test.mjs

      - name: Restore approved embedded badges and profile bindings
        run: |
          node scripts/apply-all-hq-team-badges.mjs
          node scripts/apply-profile-team-badges.mjs

      - name: Apply team colors and soft card gradients
        run: node scripts/apply-team-card-gradients.mjs

      - name: Apply club and player card colors
        run: node scripts/apply-club-player-card-colors.mjs

      - name: Build real Liga standings table
        run: node scripts/apply-league-team-card-colors.mjs

      - name: Sync Champions and Europa qualification labels
        run: node scripts/apply-league-qualification-zones.mjs

      - name: Add assigned DT names to Liga table
        run: node scripts/apply-league-manager-names.mjs

      - name: Keep PES6 player stats in player cards
        run: node scripts/apply-player-pes6-stats.mjs

      - name: Add contextual market actions to player search
        run: node scripts/apply-search-player-market-actions.mjs

      - name: Connect real competition cycle management
        run: node scripts/fix-cycle-management-mobile.mjs

      - name: Fix latest honours cards
        run: node scripts/fix-latest-honours-cards.mjs

      - name: Keep AJPA trophy cabinet in final UI
        run: node scripts/apply-trophy-cabinet.mjs

      - name: Apply Liga AJPA vitrina banner
        run: node scripts/apply-league-vitrina-banner.mjs

      - name: Move Copas to main menu and add Staff lifecycle controls
        run: node scripts/apply-cup-main-menu-controls.mjs

      - name: Fix Copas hub initial content load
        run: node scripts/fix-cup-hub-initial-load.mjs

      - name: Separate Champions and Europa loading menus
        run: node scripts/apply-cup-independent-preclassification.mjs

      - name: Add cup badges trophies and standalone menu card
        run: node scripts/apply-cup-visual-polish.mjs

      - name: Use transparent Champions trophy in card thumbnail
        run: node scripts/apply-champions-card-icon.mjs

      - name: Place Copa directly below Liga in main menu
        run: node scripts/fix-cup-main-menu-placement.mjs

      - name: Integrate functional sections into redesigned shell
        run: node scripts/apply-ui-redesign-functional-shell.mjs

      - name: Apply unified redesigned UI to every functional screen
        run: node scripts/apply-ui-redesign-all-screens.mjs

      - name: Apply approved Mi Club layout and iconography
        run: node scripts/apply-mi-club-approved-style.mjs

      - name: Apply approved Mercado layout and iconography
        run: node scripts/apply-market-approved-style.mjs

      - name: Apply approved Copas layout and imagery
        run: node scripts/apply-copas-approved-style.mjs

      - name: Apply approved Perfil layout and internet iconography
        run: node scripts/apply-profile-approved-style.mjs

      - name: Validate production functions survived redesign
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ui = fs.readFileSync('src/BotParityAppV2.tsx', 'utf8');
          const required = [
            ["Agentes libres", "openScreen('freeAgents')"],
            ["Clausulazo", "clausulazo"],
            ["Ofertas", "offers"],
            ["Staff/Admin", "admin"],
            ["Gestión de ciclo", "competition"],
            ["Liga real", "leagueTableHeader"],
            ["PES6 stats", "PlayerPes6StatsButton"],
          ];
          for (const [label, token] of required) {
            if (!ui.includes(token)) throw new Error(label + ' missing after redesign transforms: ' + token);
          }
          if (/title="Agentes libres"[^\n>]*onPress=\{\(\) => openScreen\('transferibles'\)\}/.test(ui)) {
            throw new Error('Agentes libres volvió a apuntar a Transferibles');
          }
          console.log('AJPA Lab parity OK: production functions survived visual transforms');
          NODE

      - name: Restore redesigned shell imports after production transforms
        run: |
          node <<'NODE'
          const fs = require('fs');

          {
            const path = 'src/BotParityAppV2.tsx';
            let ui = fs.readFileSync(path, 'utf8');
            if (!/\bImage\b/.test(ui.split("from 'react-native';")[0])) {
              ui = ui.replace(
                "  Alert,\n  ImageBackground,",
                "  Alert,\n  Image,\n  ImageBackground,"
              );
            }
            fs.writeFileSync(path, ui);
          }

          {
            const path = 'App.tsx';
            let app = fs.readFileSync(path, 'utf8');
            const anchor = "import BotParityAppV2";
            const lineEnd = app.indexOf('\n', app.indexOf(anchor));
            if (lineEnd < 0) throw new Error('BotParity import missing in Lab shell');
            const importLine = app.slice(app.indexOf(anchor), lineEnd);
            const additions = [
              "import CupCenterFab from './src/CupCenterFab';",
              "import SeasonHistoryFab from './src/SeasonHistoryFab';",
              "import CompetitionCycleAdminFab from './src/CompetitionCycleAdminFab';",
            ];
            let insertAt = lineEnd + 1;
            for (const line of additions) {
              if (!app.includes(line)) {
                app = app.slice(0, insertAt) + line + '\n' + app.slice(insertAt);
                insertAt += line.length + 1;
              }
            }
            fs.writeFileSync(path, app);
          }

          console.log('AJPA Lab shell imports restored after production transforms');
          NODE

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - name: Build standalone APK
        run: |
          printf '\norg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\norg.gradle.daemon=false\norg.gradle.workers.max=2\n' >> gradle.properties
          ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AJPA-UI-Lab.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AJPA-UI-Lab
          path: mobile/AJPA-UI-Lab.apk
          if-no-files-found: error
