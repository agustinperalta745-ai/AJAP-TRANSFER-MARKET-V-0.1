name: Mobile Preview APK

on:
  push:
    branches:
      - main
      - feature/mobile-app-foundation
      - fix/mobile-clausulazo-badges
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-preview-apk.yml'

jobs:
  build-android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Verify live AJPA API
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request

          url = os.environ['EXPO_PUBLIC_API_URL'].rstrip('/') + '/health'
          last = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      if 200 <= response.status < 300:
                          print(f'AJPA API OK: {url} -> HTTP {response.status}')
                          break
                      last = RuntimeError(f'HTTP {response.status}')
              except Exception as exc:
                  last = exc
              if attempt < 11:
                  time.sleep(10)
          else:
              raise SystemExit(f'AJPA API no responde en {url}: {last}')
          PY

      - name: Apply Discord menu parity
        run: node scripts/apply-discord-menu-parity.mjs

      - name: Apply team badges
        run: node scripts/apply-team-badges.mjs

      - name: Apply operational Clausulazo
        run: node scripts/apply-clausulazo-mobile.mjs

      - name: Apply operational Staff market
        run: node scripts/apply-staff-mobile.mjs

      - name: Apply Clausulazo Figo background
        run: |
          node <<'NODE'
          const fs = require('fs');
          const uiPath = 'src/BotParityAppV2.tsx';
          let ui = fs.readFileSync(uiPath, 'utf8');
          const figo = 'https://img.vavel.com/b/figo%20traspaso.jpg';
          const from = `  const screenBackground = (() => {\n    if (screen === 'profile') return BG_PERFIL;`;
          const to = `  const screenBackground = (() => {\n    if (screen === 'clausulazo') return '${figo}';\n    if (screen === 'profile') return BG_PERFIL;`;
          if (!ui.includes(`screen === 'clausulazo') return '${figo}'`)) {
            if (!ui.includes(from)) throw new Error('No se encontró selector de fondo para Clausulazo');
            ui = ui.replace(from, to);
          }
          fs.writeFileSync(uiPath, ui);
          NODE

      - name: Prepare polished visuals
        run: |
          node <<'NODE'
          const fs = require('fs');
          const uiPath = 'src/LiveAppBackgrounds.tsx';
          let ui = fs.readFileSync(uiPath, 'utf8');
          if (!ui.includes('blurRadius={6}')) {
            ui = ui.replace(
              '<Image source={{ uri: BG[tab] }} style={s.background} resizeMode="cover" />',
              '<Image source={{ uri: BG[tab] }} style={s.background} resizeMode="cover" blurRadius={6} />'
            );
          }
          fs.writeFileSync(uiPath, ui);
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

      - name: Build standalone APK
        run: ./gradlew assembleRelease
        working-directory: mobile/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AJPA-Transfer-Market-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AJPA-Transfer-Market-preview
          path: mobile/AJPA-Transfer-Market-preview.apk
          if-no-files-found: error
