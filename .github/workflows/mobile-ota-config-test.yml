name: Mobile OTA Config Tests

on:
  pull_request:
    paths:
      - 'mobile/App.tsx'
      - 'mobile/app.json'
      - 'mobile/package.json'
      - 'mobile/scripts/**'
      - '.github/workflows/mobile-ota-config-test.yml'
      - '.github/workflows/mobile-ota-update.yml'
  push:
    branches:
      - main
    paths:
      - 'mobile/App.tsx'
      - 'mobile/app.json'
      - 'mobile/package.json'
      - 'mobile/scripts/**'
      - '.github/workflows/mobile-ota-config-test.yml'
      - '.github/workflows/mobile-ota-update.yml'

jobs:
  validate-ota-native-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Restore launcher icon required by Expo config
        run: |
          mkdir -p assets
          cat \
            icon_chunks/00.txt \
            icon_chunks/01.txt \
            icon_chunks/02.txt \
            icon_chunks/03a.txt \
            icon_chunks/03b.txt \
            icon_chunks/03c.txt \
            icon_chunks/03d.txt \
            icon_chunks/03e.txt \
            | tr -d '\n\r' \
            | base64 --decode > assets/ajpa-app-icon.png

      - name: Apply OTA production transforms
        run: |
          node scripts/apply-discord-menu-parity.mjs
          node scripts/apply-clausulazo-mobile.mjs
          node scripts/apply-staff-mobile.mjs
          node scripts/apply-staff-economy-mobile.mjs
          node scripts/apply-resignation-mobile.mjs
          node scripts/apply-organized-menu-style.mjs
          node scripts/apply-premium-navigation-style.mjs
          node scripts/apply-approved-screen-layout.mjs
          node scripts/restore-clausulazo-screen.mjs
          node scripts/apply-runtime-visual-fixes.mjs
          node scripts/apply-club-profiles-awards.mjs
          node scripts/apply-classic-rival-mobile.mjs
          node scripts/prepare-local-section-backgrounds.mjs
          node scripts/apply-premium-depth-v2.mjs
          node scripts/apply-monaco-badge-test.mjs
          node scripts/apply-all-hq-team-badges.mjs
          node scripts/apply-profile-team-badges.mjs
          node scripts/apply-team-card-gradients.mjs
          node scripts/apply-club-player-card-colors.mjs
          grep -q "league-team-card-colors applied" src/BotParityAppV2.tsx
          grep -q "<TeamCardBackdrop club={row.team} />" src/BotParityAppV2.tsx
          grep -q "<ClubBadge club={row.team} size={46}" src/BotParityAppV2.tsx
          echo 'AJPA OTA visual pipeline OK: Liga tematizada con assets aprobados.'

      - name: Check OTA publisher syntax
        run: node --check scripts/build-ota-manifest.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Validate Expo OTA config
        run: |
          npx expo config --type public --json > /tmp/ajpa-expo-config.json
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('/tmp/ajpa-expo-config.json', 'utf8'));
          if (config.runtimeVersion !== '1') throw new Error(`runtimeVersion inesperado: ${config.runtimeVersion}`);
          const url = config.updates?.url;
          if (url !== 'https://ajap-transfer-market-v-01-production.up.railway.app/api/v1/ota/manifest') {
            throw new Error(`updates.url inesperado: ${url}`);
          }
          if (!config.updates?.enabled) throw new Error('expo-updates quedó deshabilitado');
          console.log(`AJPA OTA config OK: runtime=${config.runtimeVersion} url=${url}`);
          NODE

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - name: Verify expo-updates native wiring
        run: |
          grep -R "expo.modules.updates.EXPO_UPDATE_URL" android/app/src/main/AndroidManifest.xml
          grep -R "expo.modules.updates.EXPO_RUNTIME_VERSION" android/app/src/main/AndroidManifest.xml
          grep -R "api/v1/ota/manifest" android/app/src/main/res android/app/src/main/AndroidManifest.xml
          grep -R ">1<" android/app/src/main/res/values || true
          echo "AJPA expo-updates quedó conectado al binario Android."
