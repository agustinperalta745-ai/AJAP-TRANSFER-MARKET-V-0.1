name: Monaco Binary Badge Test

on:
  workflow_dispatch:
  push:
    branches:
      - fix/monaco-binary-final
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-monaco-binary-test.yml'

jobs:
  build-android-monaco-binary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare AJPA launcher icon
        run: |
          mkdir -p assets
          cat \
            icon_chunks/00.txt \
            icon_chunks/01.txt \
            icon_chunks/02.txt \
            icon_chunks/03a.txt \
            icon_chunks/03b.txt \
            icon_chunks/03c.txt \
            icon_chunks/03d.txt \
            icon_chunks/03e.txt \
            | tr -d '\n\r' \
            | base64 --decode > assets/ajpa-app-icon.png
          python - <<'PY'
          from pathlib import Path
          data = Path('assets/ajpa-app-icon.png').read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('AJPA launcher icon is not a valid PNG')
          print(f'AJPA launcher icon ready: {len(data)} bytes')
          PY

      - name: Apply Discord menu parity
        run: node scripts/apply-discord-menu-parity.mjs

      - name: Apply operational Clausulazo
        run: node scripts/apply-clausulazo-mobile.mjs

      - name: Apply operational Staff market
        run: node scripts/apply-staff-mobile.mjs

      - name: Apply operational Staff economy
        run: node scripts/apply-staff-economy-mobile.mjs

      - name: Apply operational club resignation
        run: node scripts/apply-resignation-mobile.mjs

      - name: Apply organized menus and panel style
        run: node scripts/apply-organized-menu-style.mjs

      - name: Apply premium navigation and glass effects
        run: node scripts/apply-premium-navigation-style.mjs

      - name: Apply approved personalized layout
        run: node scripts/apply-approved-screen-layout.mjs

      - name: Preserve Clausulazo screen after layout
        run: node scripts/restore-clausulazo-screen.mjs

      - name: Apply runtime crash and visual fixes
        run: node scripts/apply-runtime-visual-fixes.mjs

      - name: Prepare polished visuals
        run: |
          node <<'NODE'
          const fs = require('fs');
          const uiPath = 'src/LiveAppBackgrounds.tsx';
          let ui = fs.readFileSync(uiPath, 'utf8');
          if (!ui.includes('blurRadius={6}')) {
            ui = ui.replace(
              '<Image source={{ uri: BG[tab] }} style={s.background} resizeMode="cover" />',
              '<Image source={{ uri: BG[tab] }} style={s.background} resizeMode="cover" blurRadius={6} />'
            );
          }
          fs.writeFileSync(uiPath, ui);
          NODE

      - name: Apply club profiles, treasury and awards
        run: node scripts/apply-club-profiles-awards.mjs

      - name: Apply classic rival system
        run: node scripts/apply-classic-rival-mobile.mjs

      - name: Prepare local Liga and Mercado backgrounds
        run: node scripts/prepare-local-section-backgrounds.mjs

      - name: Apply premium depth v2 and Liga background
        run: node scripts/apply-premium-depth-v2.mjs

      - name: Validate Monaco direct binary PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import struct
          import zlib

          badge = Path('assets/team_badge_test/as_monaco_64.png')
          data = badge.read_bytes()
          expected = 'a34d02642a001aeb395a12359f5e900204a8d39c3fa713a41f866e019c05fa67'
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Monaco binary badge: SHA-256 inesperado')
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Monaco binary badge: firma PNG inválida')
          if len(data) < 33 or data[12:16] != b'IHDR':
              raise SystemExit('Monaco binary badge: IHDR inválido')
          width, height, bit_depth, color_type = struct.unpack('>IIBB', data[16:26])
          if (width, height) != (64, 64):
              raise SystemExit(f'Monaco binary badge: tamaño inesperado {width}x{height}')
          if bit_depth != 8 or color_type != 6:
              raise SystemExit(f'Monaco binary badge: se esperaba RGBA 8-bit, recibido depth={bit_depth} type={color_type}')

          pos = 8
          saw_iend = False
          while pos + 12 <= len(data):
              length = struct.unpack('>I', data[pos:pos+4])[0]
              ctype = data[pos+4:pos+8]
              chunk = data[pos+8:pos+8+length]
              crc = struct.unpack('>I', data[pos+8+length:pos+12+length])[0]
              if (zlib.crc32(ctype + chunk) & 0xffffffff) != crc:
                  raise SystemExit(f'Monaco binary badge: CRC inválido en {ctype!r}')
              pos += 12 + length
              if ctype == b'IEND':
                  saw_iend = True
                  break
          if not saw_iend or pos != len(data):
              raise SystemExit('Monaco binary badge: PNG truncado o con bytes extra')
          print(f'Monaco binary PNG OK: {width}x{height}, RGBA 8-bit, SHA/CRC OK, {len(data)} bytes')
          PY

      - name: Apply Monaco badge test
        run: node scripts/apply-monaco-badge-test.mjs

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

      - name: Build standalone APK
        run: ./gradlew assembleRelease
        working-directory: mobile/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AJPA-Transfer-Market-Monaco-binary-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AJPA-Monaco-binary-test
          path: mobile/AJPA-Transfer-Market-Monaco-binary-test.apk
          if-no-files-found: error
