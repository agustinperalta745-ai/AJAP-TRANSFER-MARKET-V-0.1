name: Mobile Monaco Branch Check

on:
  push:
    branches:
      - fix/monaco-hd-card-depth
  workflow_dispatch:

jobs:
  build-android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://ajap-transfer-market-v-01-production.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare launcher icon
        run: |
          mkdir -p assets
          cat icon_chunks/00.txt icon_chunks/01.txt icon_chunks/02.txt icon_chunks/03a.txt icon_chunks/03b.txt icon_chunks/03c.txt icon_chunks/03d.txt icon_chunks/03e.txt | tr -d '\n\r' | base64 --decode > assets/ajpa-app-icon.png

      - name: Apply mobile transforms
        run: |
          node scripts/apply-discord-menu-parity.mjs
          node scripts/apply-clausulazo-mobile.mjs
          node scripts/apply-staff-mobile.mjs
          node scripts/apply-staff-economy-mobile.mjs
          node scripts/apply-resignation-mobile.mjs
          node scripts/apply-organized-menu-style.mjs
          node scripts/apply-premium-navigation-style.mjs
          node scripts/apply-approved-screen-layout.mjs
          node scripts/restore-clausulazo-screen.mjs
          node scripts/apply-runtime-visual-fixes.mjs
          node scripts/apply-club-profiles-awards.mjs
          node scripts/apply-classic-rival-mobile.mjs
          node scripts/prepare-local-section-backgrounds.mjs
          node scripts/apply-premium-depth-v2.mjs
          node scripts/apply-monaco-badge-test.mjs

      - name: Inspect nullable snapshot references
        run: |
          nl -ba src/BotParityAppV2.tsx | sed -n '595,610p;760,775p'
          grep -n "snapshot" src/BotParityAppV2.tsx | head -80

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: mobile/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AJPA-Transfer-Market-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AJPA-Transfer-Market-Monaco-HD
          path: mobile/AJPA-Transfer-Market-preview.apk
          if-no-files-found: error
