name: Apply Latest Honours Home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-latest-honours-home.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Wire latest honours backend
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, marker):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  print(f'{path}: already wired')
                  return
              if old not in text:
                  raise SystemExit(f'{path}: anchor not found for {marker}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'{path}: wired {marker}')

          replace_once(
              'bot_mobile.py',
              'import classic_rival_ownership_reset_patch  # noqa: E402\nimport mobile_match_search_patch  # noqa: E402',
              'import classic_rival_ownership_reset_patch  # noqa: E402\nimport mobile_latest_honours_api_patch  # noqa: E402\nimport mobile_match_search_patch  # noqa: E402',
              'import mobile_latest_honours_api_patch',
          )
          replace_once(
              'bot_mobile.py',
              'classic_rival_ownership_reset_patch.apply_classic_rival_ownership_reset_patch()\nmobile_match_search_patch.apply_mobile_match_search_patch()',
              'classic_rival_ownership_reset_patch.apply_classic_rival_ownership_reset_patch()\nmobile_latest_honours_api_patch.apply_mobile_latest_honours_api_patch()\nmobile_match_search_patch.apply_mobile_match_search_patch()',
              'mobile_latest_honours_api_patch.apply_mobile_latest_honours_api_patch()',
          )
          PY

      - name: Apply compact home UI to source
        run: |
          cd mobile
          node scripts/apply-latest-honours-home.mjs

      - name: Validate backend syntax
        run: python -m py_compile mobile_latest_honours_api_patch.py bot_mobile.py

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: TypeScript check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Validate source diff
        run: git diff --check

      - name: Trigger OTA and commit
        run: |
          printf 'latest-honours-home-%s\n' "$(date -u +%Y%m%dT%H%M%SZ)" > .ota-trigger
          git config user.name "AJPA Feature Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            bot_mobile.py \
            mobile/src/api.ts \
            mobile/src/BotParityAppV2.tsx \
            .ota-trigger
          if git diff --cached --quiet; then
            echo "Latest honours feature already applied."
            exit 0
          fi
          git commit -m "feat: show latest AJPA honours on mobile home"
          git push origin HEAD:main
