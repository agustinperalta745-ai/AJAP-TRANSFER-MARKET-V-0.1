<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101915">
  <meta name="description" content="AJPA Transfer Market - mercado de fichajes de PES 6">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <title>AJPA Transfer Market</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>
          <strong>AJPA</strong>
          <span>TRANSFER MARKET</span>
        </div>
      </div>
      <button id="installButton" class="install-button" hidden>Instalar app</button>
    </header>

    <main>
      <div class="preview-badge">VISTA PREVIA · DATOS DEMO</div>

      <section class="club-card">
        <div class="club-card__top">
          <div>
            <p class="eyebrow">MI CLUB</p>
            <h1>Olympique de Lyon</h1>
          </div>
          <div class="club-badge">OL</div>
        </div>
        <div class="budget-row">
          <div>
            <span>Presupuesto</span>
            <strong>$10.000.000</strong>
          </div>
          <div class="market-status">
            <span class="status-dot"></span>
            Mercado abierto
          </div>
        </div>
      </section>

      <section class="section-block">
        <div class="section-heading">
          <div>
            <p class="eyebrow">ACCESOS RÁPIDOS</p>
            <h2>¿Qué querés hacer?</h2>
          </div>
        </div>

        <div class="action-grid">
          <button class="action-card">
            <span class="action-icon">👥</span>
            <strong>Mi Plantilla</strong>
            <small>Jugadores y OVR</small>
          </button>
          <button class="action-card">
            <span class="action-icon">🔄</span>
            <strong>Mercado</strong>
            <small>Ver publicaciones</small>
          </button>
          <button class="action-card">
            <span class="action-icon">📨</span>
            <strong>Mis Ofertas</strong>
            <small>Gestionar negocios</small>
          </button>
          <button class="action-card">
            <span class="action-icon">🔎</span>
            <strong>Buscar Jugador</strong>
            <small>Buscador global</small>
          </button>
        </div>
      </section>

      <section class="movement-card">
        <div class="section-heading compact">
          <div>
            <p class="eyebrow">ÚLTIMO MOVIMIENTO</p>
            <h2>Actividad del mercado</h2>
          </div>
          <span class="live-pill">LIVE</span>
        </div>
        <div class="transfer-row">
          <div class="player-avatar">R</div>
          <div class="transfer-copy">
            <strong>Ronaldinho</strong>
            <span>Transferencia completada</span>
          </div>
          <div class="transfer-price">$50M</div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-item active" aria-label="Inicio"><span>⌂</span><small>Inicio</small></button>
      <button class="nav-item" aria-label="Plantilla"><span>♟</span><small>Plantilla</small></button>
      <button class="nav-item nav-market" aria-label="Mercado"><span>⇄</span><small>Mercado</small></button>
      <button class="nav-item" aria-label="Ofertas"><span>✉</span><small>Ofertas</small></button>
      <button class="nav-item" aria-label="Perfil"><span>●</span><small>Perfil</small></button>
    </nav>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
